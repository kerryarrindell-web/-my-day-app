name: Bloom checks
on:
  push:
    branches: [feature/v2-bloom-edition]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/storage.test.cjs
      - run: node --check my-day-v11.js && node --check sw.js
